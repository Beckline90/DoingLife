
name: Doing Life .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./backend/DoingLife.WebApi/DoingLife.WebApi.csproj

      - name: Build project
        run: dotnet build ./backend/DoingLife.WebApi/DoingLife.WebApi.csproj --configuration Release --no-restore
