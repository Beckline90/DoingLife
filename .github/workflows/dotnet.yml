name: Doing Life .NET Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./backend/DoingLife.WebApi.Tests/DoingLife.WebApi.Tests.csproj

      - name: Build
        run: dotnet build ./backend/DoingLife.WebApi.Tests/DoingLife.WebApi.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test ./backend/DoingLife.WebApi.Tests/DoingLife.WebApi.Tests.csproj --configuration Release --no-build --verbosity normal
